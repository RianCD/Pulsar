# Perfil destinado a testes com doubles fornecidos pela suite.
# Nao importa .env, nao conecta ao banco e nao habilita coleta automatica.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
mediastack.api.url=http://localhost:1/news
mediastack.api.access-key=test-only-not-a-real-key
pulsar.ollama.base-url=http://localhost:1
pulsar.news.collection.enabled=false
