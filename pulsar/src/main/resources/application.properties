spring.profiles.default=dev

# Configuracoes comuns; credenciais e importacao do .env ficam nos perfis.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

mediastack.api.url=${MEDIASTACK_API_URL:https://api.mediastack.com/v1/news}
mediastack.api.limit=${MEDIASTACK_API_LIMIT:3}
mediastack.api.connect-timeout=${MEDIASTACK_API_CONNECT_TIMEOUT:PT10S}
mediastack.api.read-timeout=${MEDIASTACK_API_READ_TIMEOUT:PT30S}

pulsar.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
pulsar.ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3}
pulsar.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:all-minilm}
pulsar.ollama.chat-timeout=${OLLAMA_CHAT_TIMEOUT:PT2M}
pulsar.ollama.embedding-timeout=${OLLAMA_EMBEDDING_TIMEOUT:PT2M}
pulsar.ollama.temperature=${OLLAMA_TEMPERATURE:0.3}

# ISO-8601: PT1H = uma hora; PT30S = trinta segundos.
pulsar.news.collection.enabled=${PULSAR_NEWS_COLLECTION_ENABLED:false}
pulsar.news.collection.interval=${PULSAR_NEWS_COLLECTION_INTERVAL:PT1H}
pulsar.news.collection.initial-delay=${PULSAR_NEWS_COLLECTION_INITIAL_DELAY:PT30S}
