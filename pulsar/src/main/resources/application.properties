# Configuracao local opcional (formato Java Properties). Variaveis do ambiente tem precedencia.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# ==========================================
# configuracoes do Banco de Dados (Supabase)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# configuracoes do JPA / Hibernate
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "update" faz o Spring criar/atualizar as tabelas automaticamente baseado no codigo Java
spring.jpa.hibernate.ddl-auto=update
# Exibe as queries SQL no console (excelente para depuracao e aprendizado)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
#configuracao de API externa
# ==========================================
mediastack.api.url=https://api.mediastack.com/v1/news
mediastack.api.access_key=${MEDIASTACK_API_ACCESS_KEY}
